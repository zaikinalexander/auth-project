# app.seoniks.ru: SPA из /var/www/auth-app и API на 127.0.0.1:8080.
#
# Listen привязан к внешнему адресу сервера, а не только к wildcard.
# ispmanager генерирует свои вхосты как listen <внешний IP>:80/443,
# а nginx подбирает виртуальный сервер по паре адрес:порт. При одном
# лишь "listen 80" блок попадает только в wildcard-пару 0.0.0.0:80,
# и весь трафик на внешний IP разбирает вхост панели как default_server,
# игнорируя server_name. Замените адрес на свой.
#
# Ставить в /etc/nginx/conf.d/zz-auth-app.conf, затем nginx -t && systemctl reload nginx.

server {
    listen 195.208.60.96:80;
    listen 80;
    listen [::]:80;
    server_name app.seoniks.ru;

    # продление сертификата Let's Encrypt механизмом ispmanager
    location ^~ /.well-known/acme-challenge/ {
        alias /usr/local/mgr5/www/letsencrypt/;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 195.208.60.96:443 ssl;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.seoniks.ru;

    ssl_certificate     /var/www/httpd-cert/www-root/seoniks.ru_le3.crtca;
    ssl_certificate_key /var/www/httpd-cert/www-root/seoniks.ru_le3.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         EECDH:+AES256:-3DES:RSA+AES:!NULL:!RC4;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_appseoniks:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root  /var/www/auth-app;
    index index.html;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # history-режим роутера: любой неизвестный путь отдаётся в index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # именно $remote_addr, а не $proxy_add_x_forwarded_for: иначе клиент
        # подставляет свой заголовок и сбивает ключ ограничения попыток входа,
        # собранный из адреса клиента и email.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # security-заголовки задаёт nginx, копии от бэкенда убираем
        proxy_hide_header X-Powered-By;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    location ~ /\. {
        deny all;
    }
}
